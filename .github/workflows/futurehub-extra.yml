name: Future Hub Extra Check-in

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futurehub-extra-check-in
  cancel-in-progress: false

jobs:
  checkin-extra:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check in extra Future Hub accounts
        env:
          ACCOUNTS: ${{ secrets.FUTUREHUB_EXTRA_ACCOUNTS }}
          DEBUG: 'false'
        run: uv run python -u main.py
