name: NOFX 自动签到

on:
  schedule:
    # 09:17 Asia/Shanghai (GitHub Actions cron is UTC).
    - cron: '17 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nofx-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NOFX_STORAGE_STATE_B64: ${{ secrets.NOFX_STORAGE_STATE_B64 }}
      NOFX_BASE_URL: https://nofx.one
      NOFX_LOCALE: zh-CN

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: 安装依赖和 Chromium
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      - name: 执行 NOFX 签到
        run: uv run python -u nofx_checkin.py
