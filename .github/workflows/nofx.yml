name: NOFX 自动签到

on:
  schedule:
    # 00:00 Asia/Shanghai (GitHub Actions cron is UTC).
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nofx-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NOFX_STORAGE_STATE_B64_1: ${{ secrets.NOFX_STORAGE_STATE_B64_1 }}
      NOFX_STORAGE_STATE_B64_2: ${{ secrets.NOFX_STORAGE_STATE_B64_2 }}
      NOFX_STORAGE_STATE_B64_3: ${{ secrets.NOFX_STORAGE_STATE_B64_3 }}
      NOFX_STORAGE_STATE_B64_4: ${{ secrets.NOFX_STORAGE_STATE_B64_4 }}
      NOFX_STORAGE_STATE_B64_5: ${{ secrets.NOFX_STORAGE_STATE_B64_5 }}
      NOFX_STORAGE_STATE_B64_6: ${{ secrets.NOFX_STORAGE_STATE_B64_6 }}
      NOFX_STORAGE_STATE_B64_7: ${{ secrets.NOFX_STORAGE_STATE_B64_7 }}
      NOFX_STORAGE_STATE_B64_8: ${{ secrets.NOFX_STORAGE_STATE_B64_8 }}
      NOFX_STORAGE_STATE_B64_9: ${{ secrets.NOFX_STORAGE_STATE_B64_9 }}
      NOFX_STORAGE_STATE_B64_10: ${{ secrets.NOFX_STORAGE_STATE_B64_10 }}
      NOFX_STORAGE_STATE_B64_11: ${{ secrets.NOFX_STORAGE_STATE_B64_11 }}
      NOFX_STORAGE_STATE_B64_12: ${{ secrets.NOFX_STORAGE_STATE_B64_12 }}
      NOFX_STORAGE_STATE_B64_13: ${{ secrets.NOFX_STORAGE_STATE_B64_13 }}
      NOFX_STORAGE_STATE_B64_14: ${{ secrets.NOFX_STORAGE_STATE_B64_14 }}
      NOFX_STORAGE_STATE_B64_15: ${{ secrets.NOFX_STORAGE_STATE_B64_15 }}
      NOFX_STORAGE_STATE_B64_16: ${{ secrets.NOFX_STORAGE_STATE_B64_16 }}
      NOFX_STORAGE_STATE_B64_17: ${{ secrets.NOFX_STORAGE_STATE_B64_17 }}
      NOFX_STORAGE_STATE_B64_18: ${{ secrets.NOFX_STORAGE_STATE_B64_18 }}
      NOFX_STORAGE_STATE_B64_19: ${{ secrets.NOFX_STORAGE_STATE_B64_19 }}
      NOFX_STORAGE_STATE_B64_20: ${{ secrets.NOFX_STORAGE_STATE_B64_20 }}
      NOFX_BASE_URL: https://nofx.one
      NOFX_LOCALE: zh-CN

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: 安装依赖和 Chromium
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      - name: 执行 NOFX 签到
        shell: bash
        run: |
          set -euo pipefail
          secret_names=(
            NOFX_STORAGE_STATE_B64_1
            NOFX_STORAGE_STATE_B64_2
            NOFX_STORAGE_STATE_B64_3
            NOFX_STORAGE_STATE_B64_4
            NOFX_STORAGE_STATE_B64_5
            NOFX_STORAGE_STATE_B64_6
            NOFX_STORAGE_STATE_B64_7
            NOFX_STORAGE_STATE_B64_8
            NOFX_STORAGE_STATE_B64_9
            NOFX_STORAGE_STATE_B64_10
            NOFX_STORAGE_STATE_B64_11
            NOFX_STORAGE_STATE_B64_12
            NOFX_STORAGE_STATE_B64_13
            NOFX_STORAGE_STATE_B64_14
            NOFX_STORAGE_STATE_B64_15
            NOFX_STORAGE_STATE_B64_16
            NOFX_STORAGE_STATE_B64_17
            NOFX_STORAGE_STATE_B64_18
            NOFX_STORAGE_STATE_B64_19
            NOFX_STORAGE_STATE_B64_20
          )
          for secret_name in "${secret_names[@]}"; do
            secret_value="${!secret_name-}"
            if [ -z "$secret_value" ]; then
              echo "::error::缺少 GitHub Environment Secret $secret_name"
              exit 1
            fi
            echo "::add-mask::$secret_value"
            NOFX_STORAGE_STATE_B64="$secret_value" NOFX_STORAGE_STATE_FILE= NOFX_ACCOUNT_SLOT="$secret_name" uv run python -u nofx_checkin.py
          done
