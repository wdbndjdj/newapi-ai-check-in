name: TaBi Token 自动签到

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: 保存调试截图和页面
        required: false
        type: boolean
        default: false

jobs:
  checkin:
    runs-on: windows-2022
    environment: production
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      TABITOKEN_ACCESS_TOKEN: ${{ secrets.TABITOKEN_ACCESS_TOKEN }}
      ACCOUNTS_GITHUB: ${{ secrets.ACCOUNTS_GITHUB }}
      PROVIDERS: ${{ secrets.PROVIDERS }}
      PROXY: ${{ secrets.PROXY }}
      STORATE_STATES_GITHUB: ${{ secrets.STORATE_STATES_GITHUB }}
      DEBUG: ${{ inputs.debug || vars.DEBUG || 'false' }}
      DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: 安装依赖和浏览器
        shell: pwsh
        run: |
          uv sync
          uv run camoufox fetch

      - name: 恢复 GitHub 登录状态
        uses: actions/cache/restore@v4
        with:
          path: storage-states
          key: tabitoken-storage-${{ github.run_id }}
          restore-keys: tabitoken-storage-

      - name: 生成 TaBi Token 账号配置
        shell: pwsh
        run: |
          if ($env:TABITOKEN_ACCESS_TOKEN) {
            $accounts = ConvertTo-Json -Compress -InputObject @(@{
              name = "TaBi Token"
              provider = "tabitoken"
              system_access_token = $env:TABITOKEN_ACCESS_TOKEN
            })
          } elseif ($env:ACCOUNTS_GITHUB) {
            $accounts = "[]"
          } else {
            throw "请配置 TABITOKEN_ACCESS_TOKEN 或 ACCOUNTS_GITHUB"
          }
          "ACCOUNTS=$accounts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 执行 TaBi Token 签到
        shell: pwsh
        run: uv run python -u main.py

      - name: 保存 GitHub 登录状态
        if: always() && hashFiles('storage-states/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: storage-states
          key: tabitoken-storage-${{ github.run_id }}

      - name: 保存调试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabitoken-${{ github.run_number }}
          path: |
            logs/
            screenshots/
          if-no-files-found: ignore
          retention-days: 7
