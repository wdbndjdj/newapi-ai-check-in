name: ChatFlowsAI daily check-in

on:
  schedule:
    - cron: '13 4 * * *' # 12:13 Beijing time
    - cron: '13 6 * * *' # 14:13 Beijing time, idempotent retry
  workflow_dispatch: {}

concurrency:
  group: chatflows-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests
        run: python -B tests/test_chatflows_checkin.py
      - name: Check in and verify
        env:
          CHATFLOWS_EMAIL: ${{ secrets.CHATFLOWS_EMAIL }}
          CHATFLOWS_PASSWORD: ${{ secrets.CHATFLOWS_PASSWORD }}
        run: python -u -B chatflows_checkin.py
