name: Hyxware daily check-in

on:
  schedule:
    - cron: '17 2 * * *' # Beijing time daily 10:17
  workflow_dispatch: {}

concurrency:
  group: hyxware-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    name: Hyxware ${{ matrix.account }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: account1
            secret: HYXWARE_ACCESS_TOKEN_1
          - account: account2
            secret: HYXWARE_ACCESS_TOKEN_2
          - account: account3
            secret: HYXWARE_ACCESS_TOKEN_3
          - account: account4
            secret: HYXWARE_ACCESS_TOKEN_4
          - account: account5
            secret: HYXWARE_ACCESS_TOKEN_5
          - account: account6
            secret: HYXWARE_ACCESS_TOKEN_6
          - account: account7
            secret: HYXWARE_ACCESS_TOKEN_7
          - account: account8
            secret: HYXWARE_ACCESS_TOKEN_8
          - account: account9
            secret: HYXWARE_ACCESS_TOKEN_9
          - account: account10
            secret: HYXWARE_ACCESS_TOKEN_10
          - account: account11
            secret: HYXWARE_ACCESS_TOKEN_11
          - account: account12
            secret: HYXWARE_ACCESS_TOKEN_12
          - account: account13
            secret: HYXWARE_ACCESS_TOKEN_13
          - account: account14
            secret: HYXWARE_ACCESS_TOKEN_14
          - account: account15
            secret: HYXWARE_ACCESS_TOKEN_15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test isolated Hyxware check-in offline
        run: python -B tests/test_hyxware_api.py
      - name: Check in and verify today's exact-date record
        env:
          HYXWARE_ACCESS_TOKEN: ${{ secrets[matrix.secret] }}
        run: python -u -B hyxware_checkin.py
